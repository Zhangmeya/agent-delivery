name: Desktop Release

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit SHA, branch, or tag to package
        required: true
        type: string
      release_version:
        description: Desktop artifact version to inject into electron-builder
        required: true
        type: string
      artifact_name:
        description: Name for the uploaded Actions artifact
        required: true
        type: string
      upload_to_release:
        description: Upload built installers to an existing GitHub Release
        required: true
        type: boolean
      github_release_tag:
        description: Existing GitHub Release tag to upload assets into
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit SHA, branch, or tag to package
        required: true
        type: string
        default: master
      release_version:
        description: Desktop artifact version to inject into electron-builder
        required: true
        type: string
      artifact_name:
        description: Name for the uploaded Actions artifact
        required: true
        type: string
        default: desktop-release-manual
      upload_to_release:
        description: Upload built installers to an existing GitHub Release
        required: true
        type: boolean
        default: false
      github_release_tag:
        description: Existing GitHub Release tag to upload assets into
        required: false
        type: string

jobs:
  build_desktop_assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-latest
            platform: mac
            arch: arm64
          - runner: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Restore tracked install-time changes
        shell: bash
        run: git checkout -- pnpm-lock.yaml

      - name: Typecheck desktop package
        shell: bash
        run: pnpm --filter @penclipai/desktop-electron typecheck

      - name: Build desktop package
        shell: bash
        env:
          PAPERCLIP_DESKTOP_RELEASE_VERSION: ${{ inputs.release_version }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && 'false' || '' }}
        run: |
          pnpm --filter @penclipai/desktop-electron dist -- --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"

      - name: Read desktop artifact manifest
        id: manifest
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const manifestPath = "packages/desktop-electron/release/desktop-artifacts.json";
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const releaseAssetPaths = Array.isArray(manifest.releaseAssetPaths) ? manifest.releaseAssetPaths : [];
          const sizeAuditPaths = Array.isArray(manifest.sizeAuditPaths) ? manifest.sizeAuditPaths : [];
          if (releaseAssetPaths.length === 0) {
            throw new Error(`No desktop release assets were listed in ${manifestPath}.`);
          }
          console.log("artifact_paths<<EOF");
          console.log([manifestPath, ...sizeAuditPaths, ...releaseAssetPaths].join("\n"));
          console.log("EOF");
          console.log("release_asset_paths<<EOF");
          console.log(releaseAssetPaths.join("\n"));
          console.log("EOF");
          console.log("size_audit_paths<<EOF");
          console.log(sizeAuditPaths.join("\n"));
          console.log("EOF");
          console.log(`release_asset_bytes=${manifest.sizeAudit?.releaseAssetBytes ?? ""}`);
          console.log(`unpacked_bytes=${manifest.sizeAudit?.unpackedBytes ?? ""}`);
          console.log(`app_runtime_bytes=${manifest.sizeAudit?.appRuntimeBytes ?? ""}`);
          console.log(`app_runtime_files=${manifest.sizeAudit?.appRuntimeFiles ?? ""}`);
          NODE

      - name: Warn on Windows desktop size budget
        if: matrix.platform == 'win'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ inputs.github_release_tag }}
          CURRENT_BYTES: ${{ steps.manifest.outputs.release_asset_bytes }}
          APP_RUNTIME_BYTES: ${{ steps.manifest.outputs.app_runtime_bytes }}
          APP_RUNTIME_FILES: ${{ steps.manifest.outputs.app_runtime_files }}
        run: |
          node - <<'NODE'
          const { execFileSync } = require("node:child_process");

          const currentTag = process.env.CURRENT_TAG || "";
          const currentBytes = Number(process.env.CURRENT_BYTES || 0);
          const appRuntimeBytes = Number(process.env.APP_RUNTIME_BYTES || 0);
          const appRuntimeFiles = Number(process.env.APP_RUNTIME_FILES || 0);
          const installerBudgetDelta = 10 * 1024 * 1024;
          const appRuntimeByteBudget = 950 * 1024 * 1024;
          const appRuntimeFileBudget = 50000;

          function warn(message) {
            console.log(`::warning title=Desktop size budget::${message}`);
          }

          if (!Number.isFinite(currentBytes) || currentBytes <= 0) {
            warn("Windows installer size was not available in desktop-artifacts.json.");
          }

          if (appRuntimeBytes > appRuntimeByteBudget) {
            warn(`Packaged app-runtime is ${(appRuntimeBytes / 1024 / 1024).toFixed(2)} MiB, above the ${(appRuntimeByteBudget / 1024 / 1024).toFixed(0)} MiB warning budget.`);
          }

          if (appRuntimeFiles > appRuntimeFileBudget) {
            warn(`Packaged app-runtime has ${appRuntimeFiles} files, above the ${appRuntimeFileBudget} file warning budget.`);
          }

          if (!currentTag || !process.env.GH_TOKEN || !currentBytes) {
            process.exit(0);
          }

          const releases = JSON.parse(execFileSync("gh", [
            "release",
            "list",
            "--repo",
            process.env.GITHUB_REPOSITORY,
            "--limit",
            "20",
            "--json",
            "tagName,isPrerelease,isDraft",
          ], { encoding: "utf8" }));
          const previous = releases.find((release) =>
            release.tagName !== currentTag && !release.isPrerelease && !release.isDraft);
          if (!previous) {
            process.exit(0);
          }

          const release = JSON.parse(execFileSync("gh", [
            "release",
            "view",
            previous.tagName,
            "--repo",
            process.env.GITHUB_REPOSITORY,
            "--json",
            "assets",
          ], { encoding: "utf8" }));
          const previousWinAsset = (release.assets || []).find((asset) =>
            /-x64\.exe$/i.test(asset.name));
          if (!previousWinAsset?.size) {
            process.exit(0);
          }

          const delta = currentBytes - previousWinAsset.size;
          if (delta > installerBudgetDelta) {
            warn(`Windows installer grew by ${(delta / 1024 / 1024).toFixed(2)} MiB versus ${previous.tagName}; threshold is 10 MiB.`);
          }
          NODE

      - name: Upload desktop artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ steps.manifest.outputs.artifact_paths }}

      - name: Upload desktop assets to GitHub Release
        if: inputs.upload_to_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${{ inputs.github_release_tag }}" ]; then
            echo "github_release_tag is required when upload_to_release=true." >&2
            exit 1
          fi

          assets=()
          while IFS= read -r asset_path; do
            if [ -n "$asset_path" ]; then
              assets+=("$asset_path")
            fi
          done <<EOF
          ${{ steps.manifest.outputs.release_asset_paths }}
          EOF

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No desktop release assets were listed in the manifest output." >&2
            exit 1
          fi

          gh release upload "${{ inputs.github_release_tag }}" "${assets[@]}" --repo "${{ github.repository }}" --clobber
